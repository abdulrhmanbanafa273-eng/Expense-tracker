{% extends "base.html" %}

{% block title %}{{ "Edit" if transaction else "Add" }} Transaction - Expense Tracker{% endblock %}

{% block content %}
<h1>{{ "Edit" if transaction else "Add" }} Transaction</h1>
<form method="post" class="transaction-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="type">Type</label>
    <select id="type" name="type" required>
        <option value="expense" {{ "selected" if transaction and transaction["type"] == "expense" }}>Expense</option>
        <option value="income" {{ "selected" if transaction and transaction["type"] == "income" }}>Income</option>
    </select>

    <label for="amount">Amount</label>
    <input
        type="number" id="amount" name="amount" step="0.01" min="0.01"
        value="{{ transaction['amount'] if transaction else '' }}" required
    >

    <label for="category">Category</label>
    <select id="category" name="category" required>
        {% for cat in categories %}
        <option value="{{ cat }}" {{ "selected" if transaction and transaction["category"] == cat }}>{{ cat }}</option>
        {% endfor %}
    </select>

    <label for="description">Description (optional)</label>
    <input
        type="text" id="description" name="description"
        value="{{ transaction['description'] if transaction and transaction['description'] else '' }}"
    >

    <label for="date">Date</label>
    <input
        type="date" id="date" name="date"
        value="{{ transaction['date'] if transaction else today }}" required
    >

    <button type="submit" data-loading-text="Saving...">{{ "Save Changes" if transaction else "Add Transaction" }}</button>
</form>
{% endblock %}
