<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('dashboard.index') }}" class="brand">Expense Tracker</a>
        <nav>
            {% if g.user %}
                <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
                <a href="{{ url_for('transactions.index') }}">Transactions</a>
                <span class="nav-username">Hi, {{ g.user["username"] }}</span>
                <form action="{{ url_for('auth.logout') }}" method="post" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="link-button" data-loading-text="Logging out...">Log out</button>
                </form>
            {% else %}
                <a href="{{ url_for('auth.login') }}">Log in</a>
                <a href="{{ url_for('auth.register') }}">Register</a>
            {% endif %}
        </nav>
    </header>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
    {% endfor %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
